version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: lexbenin_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexbenin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexbenin_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lexbenin_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexbenin} -d ${POSTGRES_DB:-lexbenin_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    container_name: lexbenin_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexbenin_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexbenin_worker
    restart: unless-stopped
    command: python -m arq src.infrastructure.queue.worker.WorkerSettings
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data:
