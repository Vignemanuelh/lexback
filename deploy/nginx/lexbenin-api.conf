# ==============================================================================
# LEXBENIN — Nginx (hôte VPS) — API : apilexbenin.emmanuelhoudji.com
# Installation : sudo cp lexbenin-api.conf /etc/nginx/sites-available/
#                sudo ln -s ../sites-available/lexbenin-api.conf /etc/nginx/sites-enabled/
# TLS          : sudo certbot --nginx -d apilexbenin.emmanuelhoudji.com
# ==============================================================================

# Zones de limitation de débit (à placer dans le contexte http : inclus ici car
# le fichier est chargé dans http{} via sites-enabled)
limit_req_zone $binary_remote_addr zone=lex_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lex_admin:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=lex_webhook:10m rate=30r/s;

upstream lexback_upstream {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name apilexbenin.emmanuelhoudji.com;

    # Challenge ACME (certbot --webroot) puis redirection HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apilexbenin.emmanuelhoudji.com;

    # Certificats (générés par certbot)
    ssl_certificate     /etc/letsencrypt/live/apilexbenin.emmanuelhoudji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apilexbenin.emmanuelhoudji.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Notes vocales / images (MAX_MEDIA_SIZE_MB=16 côté backend) + corpus JSON
    client_max_body_size 20m;
    client_body_timeout 30s;

    # Proxy commun
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    # Webhook WhatsApp (Meta) : corps brut conservé pour la signature X-Hub-Signature-256
    location /api/v1/whatsapp/ {
        limit_req zone=lex_webhook burst=60 nodelay;
        proxy_pass http://lexback_upstream;
        proxy_read_timeout 30s;
    }

    # Panneau SQLAdmin : accès restreint par IP (renseigner votre IP / VPN) + limitation
    location /admin {
        limit_req zone=lex_admin burst=10 nodelay;
        # allow 203.0.113.10;   # <-- votre IP fixe
        # deny  all;
        proxy_pass http://lexback_upstream;
        proxy_read_timeout 60s;
    }

    # API publique : SSE (réponses streamées) => pas de buffering
    location /api/ {
        limit_req zone=lex_api burst=30 nodelay;
        proxy_pass http://lexback_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header X-Accel-Buffering "no" always;
    }

    # Supervision
    location = /health {
        proxy_pass http://lexback_upstream;
        access_log off;
    }
    location = /health/ready {
        # Réservé au VPS lui-même (monitoring local)
        allow 127.0.0.1;
        deny all;
        proxy_pass http://lexback_upstream;
        access_log off;
    }

    # Documentation désactivée en production (404 explicite)
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    location / {
        return 404;
    }
}
