name: CI backend

# Qualité sur les PR et pushs vers develop/main (la CI de release ne tourne que sur les tags v*)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests (zéro warning, couverture ≥ 80 %)
        run: pytest tests/ -W error --tb=short -q --cov=. --cov-fail-under=80
      - name: Linter
        run: ruff check .
      - name: Types statiques
        run: mypy . --ignore-missing-imports
