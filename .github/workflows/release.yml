name: Release backend

# Déclenché uniquement par un tag v* créé depuis main (règle AGENTS.md §7)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: lexbenin-back

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format du tag (vX.Y.Z)
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Tag invalide : $GITHUB_REF_NAME (attendu vX.Y.Z)"; exit 1; }
      - name: Le tag doit provenir de main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Le tag $GITHUB_REF_NAME n'est pas sur main"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -W error --tb=short -q --cov=. --cov-fail-under=80
      - run: ruff check .
      - run: mypy . --ignore-missing-imports

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production   # approbation manuelle possible via les règles de l'environnement GitHub
    steps:
      - name: Configurer SSH (clé d'hôte épinglée)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Déployer sur le VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REMOTE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          TAG: ${{ github.ref_name }}
        run: |
          # Le tag est validé (vX.Y.Z) : aucune injection possible. Le token passe par stdin, jamais en argument.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$REMOTE" "GHCR_USER='$GHCR_USER' /opt/lexback/deploy/scripts/deploy.sh '$TAG'"
