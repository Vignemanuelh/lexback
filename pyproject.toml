[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexbenin-backend"
version = "0.1.0"
description = "Moteur IA RAG & API pour l'Assistant Numérique Citoyen - Code du Numérique du Bénin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.1.4",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",
    "sqladmin>=0.20.1",
    "alembic>=1.14.1",
    "google-genai>=1.0.0",
    "langfuse>=4.56.0",
    "arq>=0.28.0",
    "redis>=5.2.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.0.1",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.6",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]
